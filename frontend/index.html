<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visão Total</title>
<meta name="description" content="Sistema de gestão para vistorias veiculares: dashboards de desempenho, agendamentos, transferências e relatórios em PDF/Excel.">
<link rel="icon" href="logo.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --navy: #2d3774; --navy-dark:#1f2657; --navy-light:#4351a3;
  --red:#d92b3a; --red-dark:#b81f2d;
  --bg:#f6f6f4; --surface:#ffffff; --surface-2:#f0f0ee;
  --border:#e3e2dd; --border-strong:#d2d1ca;
  --text:#15161f; --text-2:#5a5c6b; --muted:#8b8d99;
  --good:#0ca30c; --warning:#c98200; --serious:#c85a34; --critical:#d03b3b;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#4a3aa7; --c7:#e34948; --c8:#008300;
  --shadow-sm: 0 1px 2px rgba(20,20,30,.06);
  --shadow-md: 0 6px 20px -6px rgba(30,32,60,.16);
  --shadow-lg: 0 20px 48px -12px rgba(20,22,50,.28);
  --radius: 14px;
  --ease: cubic-bezier(.22,.9,.32,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0f1017; --surface:#181a25; --surface-2:#1f212f;
    --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.16);
    --text:#f2f2f6; --text-2:#b7b9c8; --muted:#82849a;
    --navy-light:#5a68c4;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#9085e9; --c7:#e66767; --c8:#2fae2f;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 6px 24px -6px rgba(0,0,0,.5);
    --shadow-lg: 0 24px 56px -16px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0f1017; --surface:#181a25; --surface-2:#1f212f;
  --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.16);
  --text:#f2f2f6; --text-2:#b7b9c8; --muted:#82849a;
  --navy-light:#5a68c4;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#9085e9; --c7:#e66767; --c8:#2fae2f;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 6px 24px -6px rgba(0,0,0,.5);
  --shadow-lg: 0 24px 56px -16px rgba(0,0,0,.65);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;}
h1,h2,h3,.display{font-family:'Outfit',system-ui,sans-serif;letter-spacing:-.01em;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}
::selection{background:var(--navy-light);color:#fff;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--text);}
svg{display:block;}

/* ---------- App shell ---------- */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:238px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;z-index:40;transition:transform .28s var(--ease);
}
.sb-brand{display:flex;align-items:center;gap:10px;padding:20px 18px 14px;}
.sb-brand img{width:38px;height:38px;object-fit:contain;border-radius:9px;background:#fff;padding:3px;}
.sb-brand .name{font-family:'Outfit';font-weight:800;font-size:16.5px;line-height:1.1;}
.sb-brand .name small{display:block;font-family:'Inter';font-weight:500;font-size:10.5px;color:#c7cbec;letter-spacing:.04em;text-transform:uppercase;margin-top:2px;}
.sb-nav{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:2px;}
.sb-link{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#d4d8f2;
  background:transparent;border:none;text-align:left;width:100%;font-size:13.6px;font-weight:500;
  transition:background .15s var(--ease),color .15s var(--ease);
}
.sb-link svg{width:19px;height:19px;flex:none;opacity:.85;}
.sb-link:hover{background:rgba(255,255,255,.08);color:#fff;}
.sb-link.active{background:#fff;color:var(--navy);font-weight:700;}
.sb-link.active svg{opacity:1;}
.sb-foot{padding:14px 18px 18px;font-size:11px;color:#9aa1d6;border-top:1px solid rgba(255,255,255,.1);}
.sb-backdrop{display:none;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:14px 26px;
}
.hamburger{display:none;background:none;border:none;padding:6px;border-radius:8px;color:var(--text);}
.hamburger:hover{background:var(--surface-2);}
.hamburger svg{width:22px;height:22px;}
.topbar h1{margin:0;font-size:19px;font-weight:700;}
.topbar .subtitle{color:var(--muted);font-size:12.5px;margin-top:1px;}
.topbar-spacer{flex:1;}
.btn{
  display:inline-flex;align-items:center;gap:7px;border-radius:10px;border:1px solid var(--border-strong);
  background:var(--surface);color:var(--text);padding:9px 14px;font-size:13px;font-weight:600;
  transition:transform .14s var(--ease),box-shadow .14s var(--ease),background .14s;white-space:nowrap;
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);}
.btn:active{transform:translateY(0);}
.btn svg{width:16px;height:16px;}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-dark);}
.btn-accent{background:var(--red);border-color:var(--red);color:#fff;}
.btn-accent:hover{background:var(--red-dark);}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px;}
.btn-icon{padding:8px;}
.btn[disabled]{opacity:.5;pointer-events:none;}

.panel-wrap{padding:22px 26px 60px;max-width:1360px;width:100%;margin:0 auto;}
.panel{animation:panelIn .32s var(--ease);}
@keyframes panelIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ---------- Grids & cards ---------- */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
.stat{padding:16px 18px;position:relative;overflow:hidden;}
.stat-label{font-size:12px;color:var(--text-2);font-weight:600;margin-bottom:8px;}
.stat-value{font-family:'Outfit';font-weight:700;font-size:26px;letter-spacing:-.01em;}
.stat-delta{font-size:12px;font-weight:600;margin-top:6px;display:inline-flex;align-items:center;gap:4px;}
.stat-delta.up{color:var(--good);}
.stat-delta.down{color:var(--critical);}
.stat-delta.flat{color:var(--muted);}

.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media (max-width:960px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.panel-header{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.panel-header h2{margin:0;font-size:22px;}
.panel-header p{margin:3px 0 0;color:var(--muted);font-size:13px;}
.panel-actions{display:flex;gap:8px;flex-wrap:wrap;}

.chart-card{padding:18px 20px 14px;}
.chart-card h3{margin:0 0 2px;font-size:14.5px;}
.chart-card .chart-sub{font-size:11.5px;color:var(--muted);margin-bottom:10px;}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--text-2);}
.legend-item{display:flex;align-items:center;gap:6px;}
.legend-dot{width:9px;height:9px;border-radius:3px;flex:none;}

.empty-state{padding:34px 20px;text-align:center;color:var(--muted);font-size:13px;}
.empty-state svg{width:34px;height:34px;margin-bottom:10px;opacity:.5;}

/* ---------- Filters ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:11px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.03em;}
select,.input{
  background:var(--surface);border:1px solid var(--border-strong);border-radius:9px;padding:8px 11px;
  color:var(--text);font-size:13px;min-height:36px;
}
select:focus,.input:focus{outline:2px solid var(--navy-light);outline-offset:1px;}
.search-wrap{position:relative;}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);}
.search-wrap input{padding-left:32px;min-width:190px;}

/* ---------- Multi-select (caixas de seleção em dropdown) ---------- */
.msel{position:relative;}
.msel-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:168px;text-align:left;cursor:pointer;}
.msel-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.msel-btn svg{flex:none;opacity:.6;transition:transform .15s;}
.msel-btn.open svg{transform:rotate(180deg);}
.msel-panel{position:absolute;top:calc(100% + 4px);left:0;z-index:25;background:var(--surface);border:1px solid var(--border-strong);
  border-radius:10px;box-shadow:var(--shadow-md);padding:6px;min-width:230px;max-height:280px;overflow-y:auto;animation:mselIn .15s var(--ease);}
@keyframes mselIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.msel-opt{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:7px;font-size:13px;cursor:pointer;}
.msel-opt:hover{background:var(--surface-2);}
.msel-opt input{margin:0;}
.msel-clear{width:100%;margin-top:4px;padding:7px 8px;border-radius:7px;border:none;background:none;color:var(--navy-light);
  font-size:12.5px;font-weight:600;text-align:left;cursor:pointer;}
.msel-clear:hover{background:var(--surface-2);}
.msel-search{width:100%;margin-bottom:6px;}

/* ---------- Table ---------- */
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);
  font-weight:600;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody td{padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;font-variant-numeric:tabular-nums;}
tbody tr{transition:background .12s;}
tbody tr:hover{background:var(--surface-2);}
tbody tr.clickable{cursor:pointer;}
.td-strong{font-weight:600;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;}
.pill-good{background:color-mix(in srgb, var(--good) 14%, transparent);color:var(--good);}
.pill-warn{background:color-mix(in srgb, var(--warning) 16%, transparent);color:var(--warning);}
.pill-muted{background:var(--surface-2);color:var(--text-2);}
.pill-critical{background:color-mix(in srgb, var(--critical) 14%, transparent);color:var(--critical);}
.row-actions{display:flex;gap:4px;}
.icon-btn{background:none;border:none;padding:6px;border-radius:7px;color:var(--muted);}
.icon-btn:hover{background:var(--surface-2);color:var(--text);}
.icon-btn svg{width:15px;height:15px;}
.pagination{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:12px 14px;font-size:12.5px;color:var(--text-2);}

/* ---------- Drawer (forms) ---------- */
.drawer-backdrop{position:fixed;inset:0;background:rgba(10,10,20,.42);opacity:0;pointer-events:none;transition:opacity .25s var(--ease);z-index:60;}
.drawer-backdrop.open{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--surface);
  box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .3s var(--ease);
  z-index:61;display:flex;flex-direction:column;
}
.drawer.open{transform:translateX(0);}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.drawer-head h3{margin:0;font-size:16px;}
.drawer-body{padding:18px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px;}
.drawer-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px;}
.form-row{display:flex;flex-direction:column;gap:5px;}
.form-row label{font-size:12px;font-weight:600;color:var(--text-2);}
.form-row .hint{font-size:11px;color:var(--muted);font-weight:400;}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.chip-select{display:flex;flex-wrap:wrap;gap:6px;}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--text-2);transition:all .13s;}
.chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.chip.active.accent{background:var(--red);border-color:var(--red);}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:2px 0;}
.switch{position:relative;width:40px;height:22px;flex:none;}
.switch input{opacity:0;width:0;height:0;}
.switch .track{position:absolute;inset:0;background:var(--border-strong);border-radius:99px;transition:.2s;}
.switch .track:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:var(--shadow-sm);}
.switch input:checked + .track{background:var(--good);}
.switch input:checked + .track:before{transform:translateX(18px);}

/* ---------- Tag manager (config) ---------- */
.tag-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.tag{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);padding:6px 8px 6px 12px;border-radius:99px;font-size:12.5px;}
.tag button{background:none;border:none;color:var(--muted);display:flex;padding:2px;border-radius:50%;cursor:pointer;}
.tag button svg{width:12px;height:12px;}
.tag button:hover{color:var(--critical);background:rgba(208,59,59,.12);}
.tag-add{display:flex;gap:8px;margin-top:12px;}
.tag-add input{flex:1;}

/* ---------- Toast ---------- */
.toast-stack{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;transform:translateY(10px);opacity:0;animation:toastIn .3s var(--ease) forwards;}
.toast svg{width:16px;height:16px;flex:none;}
.toast.error{background:var(--critical);}
@keyframes toastIn{to{transform:none;opacity:1;}}
.toast.leaving{animation:toastOut .22s var(--ease) forwards;}
@keyframes toastOut{to{transform:translateY(8px);opacity:0;}}

/* ---------- misc ---------- */
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:8px;}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.source-badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:5px;}
.source-badge.auto{background:color-mix(in srgb, var(--c1) 16%, transparent);color:var(--c1);}
.source-badge.manual{background:var(--surface-2);color:var(--muted);}
.link-quiet{color:var(--navy-light);font-weight:600;text-decoration:none;}
.link-quiet:hover{text-decoration:underline;}
.divider{height:1px;background:var(--border);margin:14px 0;}
.mini-list{display:flex;flex-direction:column;gap:2px;}
.mini-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border);}
.mini-row:last-child{border-bottom:none;}
.avatar-dot{width:8px;height:8px;border-radius:50%;flex:none;}
.mono{font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;}
::-webkit-scrollbar-track{background:transparent;}

@media (max-width:960px){
  .sidebar{position:fixed;left:0;transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .sb-backdrop{display:block;position:fixed;inset:0;background:rgba(10,10,20,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:39;}
  .sb-backdrop.open{opacity:1;pointer-events:auto;}
  .hamburger{display:inline-flex;}
  .panel-wrap{padding:16px 14px 50px;}
  .topbar{padding:12px 14px;}
  .form-2col{grid-template-columns:1fr;}
  .topbar h1{font-size:16.5px;}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <img id="brandLogo" alt="Visão Total" src="logo.jpg">
      <div class="name">Visão Total<small>Gestão de vistorias</small></div>
    </div>
    <nav class="sb-nav" id="sbNav"></nav>
    <div class="sb-foot">Visão Total Vistorias<br>Painel interno · sincronizado em tempo real<br><button id="changeConnBtn" class="btn btn-sm btn-ghost" style="margin-top:8px;color:#c7cbec;border-color:rgba(255,255,255,.18);padding:5px 9px;">Alterar conexão</button></div>
  </aside>
  <div class="sb-backdrop" id="sbBackdrop"></div>

  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburgerBtn" aria-label="Abrir menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div>
        <h1 id="pageTitle">Visão Geral</h1>
        <div class="subtitle" id="pageSubtitle">Carregando painel…</div>
      </div>
      <div class="topbar-spacer"></div>
      <button class="btn btn-primary" data-action="open-vistoria-drawer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Nova vistoria
      </button>
    </header>
    <main class="panel-wrap" id="panelRoot">
      <div class="kpi-row">
        <div class="card stat"><div class="skeleton" style="height:60px"></div></div>
        <div class="card stat"><div class="skeleton" style="height:60px"></div></div>
        <div class="card stat"><div class="skeleton" style="height:60px"></div></div>
        <div class="card stat"><div class="skeleton" style="height:60px"></div></div>
      </div>
    </main>
  </div>
</div>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<div class="drawer" id="drawer"></div>
<div class="toast-stack" id="toastStack"></div>

<div id="connectGate" style="display:none;position:fixed;inset:0;z-index:100;background:rgba(10,10,20,.5);opacity:0;transition:opacity .25s var(--ease);align-items:center;justify-content:center;padding:16px;">
  <div class="card" style="max-width:380px;width:100%;padding:26px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-lg);">
    <div style="display:flex;align-items:center;gap:10px;">
      <img src="logo.jpg" alt="" style="width:42px;height:42px;border-radius:10px;object-fit:contain;background:var(--surface-2);padding:4px;">
      <div>
        <div style="font-family:'Outfit';font-weight:800;font-size:16.5px;">Visão Total</div>
        <div style="font-size:11.5px;color:var(--muted);">Conectar ao servidor da empresa</div>
      </div>
    </div>
    <div class="form-row"><label>Endereço do servidor</label><input class="input" id="gateUrl" placeholder="https://vt.heringfotografia.com.br"></div>
    <div class="form-row"><label>Token de acesso</label><input class="input" id="gateToken" type="password" placeholder="Cole aqui o token de acesso"></div>
    <div id="gateError" style="display:none;color:var(--critical);font-size:12.5px;"></div>
    <button class="btn btn-primary" id="gateSubmit" style="justify-content:center;">Conectar</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
"use strict";

/* =========================================================================
   ICONS
   ========================================================================= */

/* =========================================================================
   HELPERS: format, dates, money
   ========================================================================= */
function fmtMoney(n){ n = Number(n)||0; return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtCompact(n){
  n = Number(n)||0; const abs=Math.abs(n);
  if(abs>=1e6) return (n/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+'M';
  if(abs>=1e3) return (n/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+'K';
  return n.toLocaleString('pt-BR',{maximumFractionDigits:0});
}
function fmtDateBR(iso){ if(!iso) return '—'; const [y,m,d]=String(iso).split('-'); return d&&m&&y?`${d}/${m}/${y}`:iso; }
function parseISODate(iso){ if(!iso) return null; const p=String(iso).split('-'); return new Date(+p[0], +p[1]-1, +p[2]||1); }
function pad2(n){ return String(n).padStart(2,'0'); }
function toISO(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function monthKey(ano,mesNum){ return `${ano}-${pad2(mesNum)}`; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function uniq(arr){ return [...new Set(arr)]; }

function inferCanal(cliente){
  const c = (cliente||'').trim().toUpperCase();
  if(c==='GOOGLE') return 'google';
  if(c==='PARTICULAR'||c==='') return 'particular';
  return 'parceiro';
}

/* period -> {start, end, prevStart, prevEnd} using Date objects (inclusive start, exclusive end) */
function resolvePeriod(key){
  const now = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());
  let start, end;
  end = addDays(now,1);
  if(key==='mes-atual'){ start = new Date(now.getFullYear(), now.getMonth(), 1); }
  else if(key==='30d'){ start = addDays(now,-29); }
  else if(key==='90d'){ start = addDays(now,-89); }
  else if(key==='ano'){ start = new Date(now.getFullYear(),0,1); }
  else { start = new Date(2000,0,1); }
  const spanMs = end - start;
  const prevEnd = start;
  const prevStart = new Date(start.getTime()-spanMs);
  return {start,end,prevStart,prevEnd};
}
function inRange(iso, start, end){ const d=parseISODate(iso); return d && d>=start && d<end; }

/* período com opção "personalizado" (data inicial/final livres) — usado em
   Vistorias, Transferências e Relatórios */
function resolvePeriodAny(filter){
  if(filter && filter.periodo === 'custom'){
    const start = filter.customStart ? parseISODate(filter.customStart) : new Date(2000,0,1);
    const end = filter.customEnd ? addDays(parseISODate(filter.customEnd), 1) : addDays(TODAY, 1);
    const spanMs = Math.max(1, end - start);
    return { start, end, prevStart: new Date(start.getTime() - spanMs), prevEnd: start };
  }
  return resolvePeriod(filter ? filter.periodo : 'todos');
}
const PERIODO_OPCOES = [['todos','Todos'],['mes-atual','Mês atual'],['30d','Últimos 30 dias'],['90d','Últimos 90 dias'],['ano','Este ano'],['custom','Personalizado…']];
function renderPeriodField(prefix, filter, includeTodos=true){
  const opts = includeTodos ? PERIODO_OPCOES : PERIODO_OPCOES.filter(([v])=>v!=='todos');
  return `

  <div class="field"><label>Até</label><input class="input" type="date" data-period-end="${prefix}" value="${escapeHtml(filter.customEnd||'')}"></div>
  `:''}`;
}
function bindPeriodField(root, prefix, filter, onChange){
  const sel = root.querySelector(`[data-period="${prefix}"]`);
  if(sel) sel.addEventListener('change', e=>{ filter.periodo = e.target.value; onChange(); });
  const s = root.querySelector(`[data-period-start="${prefix}"]`);
  if(s) s.addEventListener('change', e=>{ filter.customStart = e.target.value; onChange(); });
  const en = root.querySelector(`[data-period-end="${prefix}"]`);
  if(en) en.addEventListener('change', e=>{ filter.customEnd = e.target.value; onChange(); });
}

/* opções de canal: Google Ads / Particular / cada cliente-parceiro cadastrado
   individualmente (ex.: "ALMEIDA VEICULOS"), para filtrar por um parceiro só */
function getCanalOptions(){
  const parceiros = (state.config.clientes||[]).filter(c=>{
    const up = (c||'').trim().toUpperCase();
    return up && up!=='GOOGLE' && up!=='PARTICULAR';
  });
  return [
    {value:'google', label:'Google Ads'},
    {value:'particular', label:'Particular'},
    ...parceiros.map(c=>({value:'cliente:'+c, label:c})),
  ];
}
function vistoriaMatchesCanal(v, selecionados){
  if(!selecionados || !selecionados.length) return true;
  const canal = v.canal || inferCanal(v.cliente);
  return selecionados.some(k=>{
    if(k==='google') return canal==='google';
    if(k==='particular') return canal==='particular';
    if(k.startsWith('cliente:')) return (v.cliente||'').trim().toUpperCase() === k.slice(8).trim().toUpperCase();
    return false;
  });
}

function bindMultiSelects(root, onChangeMap){
  root.querySelectorAll('.msel').forEach(el=>el.addEventListener('click', e=>e.stopPropagation()));
  root.querySelectorAll('[data-msel-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const field = btn.dataset.mselToggle;
      root.querySelectorAll('[data-msel-panel]').forEach(p=>{ if(p.dataset.mselPanel!==field){ p.hidden = true; p.previousElementSibling && p.previousElementSibling.classList.remove('open'); } });
      const panel = root.querySelector(`[data-msel-panel="${field}"]`);
      panel.hidden = !panel.hidden;
      btn.classList.toggle('open', !panel.hidden);
    });
  });
  root.querySelectorAll('[data-msel-check]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const field = cb.dataset.mselCheck;
      const panel = root.querySelector(`[data-msel-panel="${field}"]`);
      const values = [...panel.querySelectorAll('[data-msel-check]:checked')].map(x=>x.value);
      onChangeMap[field] && onChangeMap[field](values);
    });
  });
  root.querySelectorAll('[data-msel-clear]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ onChangeMap[btn.dataset.mselClear] && onChangeMap[btn.dataset.mselClear]([]); });
  });
}

function vistoriasConcluidas(list){ return list.filter(v=>v.status!=='pendente'); }

function sumValor(list){ return list.reduce((s,v)=>s+(Number(v.valor)||0),0); }

function getMonthFromVistorias(ano, mesNum){
  return state.vistorias.filter(v=>v.ano===ano && MESES_PT.indexOf(v.mes)+1===mesNum);
}

/* merged evolução row: prefer live vistorias data when present for that month */
function getEvoRow(doc){
  const live = getMonthFromVistorias(doc.ano, doc.mesNum);
  if(live.length){
    const ok = vistoriasConcluidas(live);
    const byCanal = {google:0,particular:0,parceiro:0};
    const qtd = {google:0,particular:0,parceiro:0};
    ok.forEach(v=>{ const c=v.canal||inferCanal(v.cliente); byCanal[c]=(byCanal[c]||0)+(Number(v.valor)||0); qtd[c]=(qtd[c]||0)+1; });
    return Object.assign({},doc,{
      faturamentoGoogle:byCanal.google, faturamentoParticular:byCanal.particular, faturamentoParceiros:byCanal.parceiro,
      qtdGoogle:qtd.google, qtdParticular:qtd.particular, qtdParceiros:qtd.parceiro,
      source:'auto'
    });
  }
  return Object.assign({source:'manual'},doc);
}
function evoSorted(){ return [...state.evolucao].sort((a,b)=> a.ano-b.ano || a.mesNum-b.mesNum); }

/* =========================================================================

function tip(el, text){ el.setAttribute('data-tip', text); }

function barChart({data, height=180, moneyFmt=true, color='var(--c1)'}){
  const w = Math.max(360, data.length*54);
  const max = Math.max(1, ...data.map(d=>d.value));
  const padL=6, padR=6, padB=26, padT=14;
  const innerH = height-padT-padB;
  const bw = Math.min(30, (w-padL-padR)/data.length*0.5);
  const step = (w-padL-padR)/data.length;
  let bars='', labels='', grid='';
  [0,.5,1].forEach(f=>{
    const y = padT + innerH*(1-f);
    grid += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
  });
  data.forEach((d,i)=>{
    const x = padL + step*i + (step-bw)/2;
    const h = Math.max(2, innerH*(d.value/max));
    const y = padT+innerH-h;
    bars += `<rect data-tip="${escapeHtml(d.label)}: ${moneyFmt?fmtMoney(d.value):fmtCompact(d.value)}" class="chart-mark" x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${d.color||color}"/>`;
    labels += `<text x="${x+bw/2}" y="${height-8}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${escapeHtml(d.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${height}" style="width:100%;height:${height}px" preserveAspectRatio="none">${grid}${bars}${labels}</svg>`;
}

function stackedBarChart({data, keys, colors, height=200, fmt=fmtMoney}){
  const w = Math.max(420, data.length*58);
  const totals = data.map(d=>keys.reduce((s,k)=>s+(Number(d[k])||0),0));
  const max = Math.max(1,...totals);
  const padL=6,padR=6,padB=26,padT=14;
  const innerH=height-padT-padB;
  const step=(w-padL-padR)/data.length;
  const bw=Math.min(30,step*0.55);
  let grid='',bars='',labels='';
  [0,.5,1].forEach(f=>{ const y=padT+innerH*(1-f); grid+=`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`; });
  data.forEach((d,i)=>{
    const x = padL+step*i+(step-bw)/2;
    let yCursor = padT+innerH;
    keys.forEach((k,ki)=>{
      const val = Number(d[k])||0;
      const h = innerH*(val/max);
      if(h<=0.3) return;
      const y = yCursor-h;
      bars += `<rect data-tip="${escapeHtml(d.label)} · ${escapeHtml(k)}: ${fmt(val)}" class="chart-mark" x="${x}" y="${y}" width="${bw}" height="${Math.max(0,h-1.5)}" rx="3" fill="${colors[ki]}"/>`;
      yCursor -= h;
    });
    labels += `<text x="${x+bw/2}" y="${height-8}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${escapeHtml(d.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${height}" style="width:100%;height:${height}px" preserveAspectRatio="none">${grid}${bars}${labels}</svg>`;
}

function lineChart({series, height=200, fmt=fmtMoney, labels}){
  const w = Math.max(420, (labels.length-1)*70+60);
  const allVals = series.flatMap(s=>s.points);
  const max = Math.max(1,...allVals), min=Math.min(0,...allVals);
  const padL=8,padR=8,padB=26,padT=14;
  const innerH=height-padT-padB, innerW=w-padL-padR;
  const n = labels.length;
  const xAt = i => padL + (n<=1?0:innerW*(i/(n-1)));
  const yAt = v => padT + innerH*(1-((v-min)/((max-min)||1)));
  let grid='';
  [0,.5,1].forEach(f=>{ const y=padT+innerH*(1-f); grid+=`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`; });
  let paths='', dots='', labelsSvg='';
  series.forEach(s=>{
    let d='';
    s.points.forEach((v,i)=>{ d += (i===0?'M':'L')+xAt(i).toFixed(1)+' '+yAt(v).toFixed(1)+' '; });
    paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.points.forEach((v,i)=>{
      dots += `<circle data-tip="${escapeHtml(s.name)} · ${escapeHtml(labels[i])}: ${fmt(v)}" class="chart-mark" cx="${xAt(i).toFixed(1)}" cy="${yAt(v).toFixed(1)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
    });
  });
  labels.forEach((l,i)=>{ labelsSvg += `<text x="${xAt(i).toFixed(1)}" y="${height-8}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${escapeHtml(l)}</text>`; });
  return `<svg viewBox="0 0 ${w} ${height}" style="width:100%;height:${height}px" preserveAspectRatio="none">${grid}${paths}${dots}${labelsSvg}</svg>`;
}

function donutChart({data, size=168, fmt=fmtMoney}){
  const total = data.reduce((s,d)=>s+d.value,0) || 1;
  const r=size*0.32, cx=size/2, cy=size/2, strokeW=size*0.155;
  let acc=-90, arcs='';
  data.forEach(d=>{
    const frac = d.value/total;
    const angle = frac*360;
    const large = angle>180?1:0;
    const a0 = acc*Math.PI/180, a1=(acc+angle)*Math.PI/180;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
    const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    if(angle>0.4){
      arcs += `<path data-tip="${escapeHtml(d.label)}: ${fmt(d.value)} (${(frac*100).toFixed(0)}%)" class="chart-mark" d="M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}" fill="none" stroke="${d.color}" stroke-width="${strokeW}"/>`;
    }
    acc += angle;
  });
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;max-width:100%">${arcs}
    <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--text)" font-family="Outfit">${fmtCompact(total)}</text>
    <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="9.5" fill="var(--muted)">total</text>
  </svg>`;
}

  return `<div class="mini-list">${data.map(d=>`

function funnelChart({steps}){
  const max = Math.max(1,...steps.map(s=>s.value));
  return `<div style="display:flex;flex-direction:column;gap:8px;">${steps.map((s,i)=>{
    const w = 30+ (s.value/max)*70;
    const pct = i===0?100:(steps[0].value? s.value/steps[0].value*100 : 0);
    return `<div>
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">
        <span style="font-weight:600;color:var(--text-2);">${escapeHtml(s.label)}</span>

function legendRow(items){

/* tooltip wiring (event delegation) */
let tooltipEl;
function ensureTooltip(){
  if(tooltipEl) return tooltipEl;
  tooltipEl = document.createElement('div');
  tooltipEl.style.cssText = 'position:fixed;pointer-events:none;background:var(--text);color:var(--bg);font-size:11.5px;font-weight:600;padding:6px 9px;border-radius:7px;z-index:200;opacity:0;transition:opacity .1s;white-space:nowrap;box-shadow:var(--shadow-md);';
  document.body.appendChild(tooltipEl);
  return tooltipEl;
}
document.addEventListener('mousemove', e=>{
  const mark = e.target.closest('.chart-mark');
  const t = ensureTooltip();
  if(mark && mark.dataset.tip){
    t.textContent = mark.dataset.tip;
    t.style.left = (e.clientX+14)+'px';
    t.style.top = (e.clientY+14)+'px';
    t.style.opacity='1';
  } else { t.style.opacity='0'; }
});

/* =========================================================================
   ANIMATED NUMBER
   ========================================================================= */
function animateValue(el){
  const to = Number(el.dataset.count)||0;
  const fmt = el.dataset.fmt;
  const dur = 650; const t0 = performance.now();
  function fmtFn(v){ return fmt==='money'?fmtMoney(v):fmt==='compact'?fmtCompact(v):Math.round(v).toLocaleString('pt-BR'); }
  function step(t){
    const p = Math.min(1,(t-t0)/dur);
    const eased = 1-Math.pow(1-p,3);
    el.textContent = fmtFn(to*eased);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function mountAnimatedNumbers(root){
  root.querySelectorAll('[data-count]').forEach(animateValue);
}

/* =========================================================================
   TOASTS
   ========================================================================= */
function toast(msg, type){
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = 'toast'+(type==='error'?' error':'');
  el.innerHTML = icon(type==='error'?'x':'check')+`<span>${escapeHtml(msg)}</span>`;
  stack.appendChild(el);
  setTimeout(()=>{ el.classList.add('leaving'); setTimeout(()=>el.remove(),240); }, 3000);
}

    else { const doc = state.evolucao.find(e=>e.ano===m.ano&&e.mesNum===m.mesNum); value = doc? (doc.faturamentoGoogle+doc.faturamentoParticular+doc.faturamentoParceiros):0; }

  // canal distribution (current period)

function filteredVistorias(){
  const f = state.ui.vistoriasFilters;
  let list = [...state.vistorias];
  if(f.periodo!=='todos'){ const {start,end}=resolvePeriodAny(f); list = list.filter(v=>inRange(v.data,start,end)); }
  if(f.tipos && f.tipos.length) list = list.filter(v=>f.tipos.includes(v.tipo));
  if(f.formas && f.formas.length) list = list.filter(v=>f.formas.includes(v.formaPagamento));
  if(f.canais && f.canais.length) list = list.filter(v=>vistoriaMatchesCanal(v, f.canais));
  if(f.status) list = list.filter(v=>(v.status||'concluida')===f.status);
  if(f.busca){ const q=f.busca.toLowerCase(); list = list.filter(v=> (v.placa||'').toLowerCase().includes(q) || (v.cliente||'').toLowerCase().includes(q) || (v.veiculo||'').toLowerCase().includes(q)); }
  return list.sort((a,b)=> (b.data||'').localeCompare(a.data||''));
}
function vistoriasFilterSummary(){
  const f = state.ui.vistoriasFilters;
  const parts = [];
  const p = PERIODO_OPCOES.find(([v])=>v===f.periodo);
  parts.push('Período: '+(f.periodo==='custom' ? `${fmtDateBR(f.customStart)||'…'} a ${fmtDateBR(f.customEnd)||'…'}` : (p?p[1]:'Todos')));
  if(f.tipos && f.tipos.length) parts.push('Tipo: '+f.tipos.join(', '));
  if(f.formas && f.formas.length) parts.push('Pagamento: '+f.formas.join(', '));
  if(f.canais && f.canais.length) parts.push('Canal: '+getCanalOptions().filter(o=>f.canais.includes(o.value)).map(o=>o.label).join(', '));
  if(f.status) parts.push('Status: '+(f.status==='pendente'?'Pendente':'Concluída'));
  if(f.busca) parts.push('Busca: "'+f.busca+'"');
  return parts.join(' · ');
}

/* =========================================================================
   PANEL: RELATÓRIOS
   ========================================================================= */
function getEffectivePeriodFilter(r){
  if(r.modo==='mensal'){
    const mesNum = r.mesRef || (TODAY.getMonth()+1), ano = r.anoRef || TODAY.getFullYear();
    const start = new Date(ano, mesNum-1, 1), end = new Date(ano, mesNum, 0);
    return { periodo:'custom', customStart: toISO(start), customEnd: toISO(end) };
  }
  if(r.modo==='anual'){
    const ano = r.anoRef || TODAY.getFullYear();
    return { periodo:'custom', customStart: `${ano}-01-01`, customEnd: `${ano}-12-31` };
  }
  return { periodo: r.periodo, customStart: r.customStart, customEnd: r.customEnd };
}
function getRelatorioExtra(r){ return { tipos: r.tipos||[], formas: r.formas||[], canais: r.canais||[], cliente: r.cliente||'' }; }
function relatorioFilterSummary(r){
  const parts = [];
  if(r.modo==='mensal') parts.push(`Mês: ${MESES_PT[(r.mesRef||TODAY.getMonth()+1)-1]}/${r.anoRef||TODAY.getFullYear()}`);
  else if(r.modo==='anual') parts.push(`Ano: ${r.anoRef||TODAY.getFullYear()}`);
  else { const p = PERIODO_OPCOES.find(([v])=>v===r.periodo); parts.push('Período: '+(r.periodo==='custom' ? `${fmtDateBR(r.customStart)||'…'} a ${fmtDateBR(r.customEnd)||'…'}` : (p?p[1]:'Todos'))); }
  if(r.cliente) parts.push('Cliente: '+r.cliente);
  if(r.tipos && r.tipos.length) parts.push('Tipo: '+r.tipos.join(', '));
  if(r.formas && r.formas.length) parts.push('Pagamento: '+r.formas.join(', '));
  if(r.canais && r.canais.length) parts.push('Canal: '+getCanalOptions().filter(o=>r.canais.includes(o.value)).map(o=>o.label).join(', '));
  return parts.join(' · ');
}
function relatorioPreviewData(r){
  const pf = getEffectivePeriodFilter(r), extra = getRelatorioExtra(r);
  const out = {};
  if(r.tipo==='vistorias' || r.tipo==='geral'){ const l = rowsFor('vistorias', pf, extra); out.vistorias = {count:l.length, total:sumValor(l)}; }
  if(r.tipo==='agendamentos' || r.tipo==='geral'){ const l = rowsFor('agendamentos', pf, {}); out.agendamentos = {count:l.length, total:sumValor(l)}; }
  if(r.tipo==='transferencias' || r.tipo==='geral'){ const l = rowsFor('transferencias', pf, {}); out.transferencias = {count:l.length, recebido:l.reduce((s,t)=>s+(Number(t.recebido)||0),0), pago:l.reduce((s,t)=>s+(Number(t.pago)||0),0)}; }
  if(r.tipo==='evolucao' || r.tipo==='geral'){ const l = rowsFor('evolucao', pf, {}); out.evolucao = {count:l.length}; }
  return out;
}

function renderRelatorioPreview(){
  const el = document.getElementById('relPreview');
  if(!el) return;
  const r = state.ui.relatorio;
  const data = relatorioPreviewData(r);
  const rows = [];
  if(data.vistorias) rows.push(['Vistorias no período', data.vistorias.count], ['Faturamento de vistorias', fmtMoney(data.vistorias.total)]);
  if(data.agendamentos) rows.push(['Agendamentos no período', data.agendamentos.count]);
  if(data.transferencias) rows.push(['Transferências no período', data.transferencias.count], ['Total recebido', fmtMoney(data.transferencias.recebido)], ['Total repassado', fmtMoney(data.transferencias.pago)]);
  if(data.evolucao) rows.push(['Meses de evolução incluídos', data.evolucao.count]);
  el.innerHTML = `
    <h3 style="margin-top:0;">Pré-visualização</h3>
    <div style="display:flex;flex-direction:column;gap:10px;font-size:13.5px;">
      ${rows.map(([l,v])=>`<div style="display:flex;justify-content:space-between;gap:10px;"><span style="color:var(--text-2);">${l}</span><b class="mono">${v}</b></div>`).join('')}
      <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-2);">Gerado em</span><b>${fmtDateBR(todayISO())}</b></div>
    </div>
    <div class="divider"></div>
    <div class="chart-sub">${escapeHtml(relatorioFilterSummary(r))||'Sem filtros adicionais.'}</div>
    <div class="chart-sub" style="margin-top:6px;">O relatório inclui cabeçalho com a marca Visão Total, os filtros aplicados e uma linha de total ao final da tabela.</div>
  `;
}
afterRender.relatorios = (root)=>{
  const r = state.ui.relatorio;
  root.querySelectorAll('[data-rel]').forEach(el=>{
    if(el.hasAttribute('data-msel-check')||el.closest('.msel')) return; // tratados pelo bindMultiSelects
    el.addEventListener('change', e=>{ r[el.dataset.rel] = e.target.value; renderRoute(); });
  });
  bindMultiSelects(root, {
    relTipos: v=>{ r.tipos = v; renderRoute(); },
    relFormas: v=>{ r.formas = v; renderRoute(); },
    relCanais: v=>{ r.canais = v; renderRoute(); },
  });
  root.querySelector('[data-action="gen-pdf"]').addEventListener('click', ()=>generateReportPDF(r.tipo, getEffectivePeriodFilter(r), getRelatorioExtra(r), relatorioFilterSummary(r)));
  root.querySelector('[data-action="gen-xlsx"]').addEventListener('click', ()=>generateReportExcel(r.tipo, getEffectivePeriodFilter(r), getRelatorioExtra(r)));
  setTimeout(renderRelatorioPreview, 0);
};

afterRender.config = (root)=>{
  root.querySelectorAll('[data-add-tag]').forEach(btn=>{
    const field = btn.dataset.addTag;
    const doAdd = ()=>{
      const input = root.querySelector(`[data-tag-input="${field}"]`);
      const v = input.value.trim(); if(!v) return;
      const arr = uniq([...(state.config[field]||[]), v]);
      updateDoc('config','geral',{[field]:arr});
      input.value='';
    };
    btn.addEventListener('click', doAdd);
    root.querySelector(`[data-tag-input="${field}"]`).addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); doAdd(); } });
  });
  root.querySelectorAll('[data-remove-tag]').forEach(btn=>btn.addEventListener('click', ()=>{
    const [field,val] = btn.dataset.removeTag.split('::');
    const arr = (state.config[field]||[]).filter(x=>x!==val);
    updateDoc('config','geral',{[field]:arr});
  }));
};

/* =========================================================================
   DRAWER: shared open/close
   ========================================================================= */
function openDrawer(html, onMount){
  const drawer = document.getElementById('drawer');
  const backdrop = document.getElementById('drawerBackdrop');
  drawer.innerHTML = html;
  backdrop.classList.add('open'); drawer.classList.add('open');
  onMount && onMount(drawer);
  drawer.querySelectorAll('[data-close-drawer]').forEach(b=>b.addEventListener('click', closeDrawer));
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerBackdrop').classList.remove('open');
}
document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);

          <div class="toggle-row"><span class="hint">Emitida</span><label class="switch"><input type="checkbox" name="notaFiscal" ${v.notaFiscal==='OK'?'checked':''}><span class="track"></span></label></div>
        </div>
      </div>
      <div class="toggle-row"><div><label style="display:block;">Status</label><span class="hint">Marque como pendente se ainda não foi fechada</span></div>
        <label class="switch"><input type="checkbox" name="status" ${v.status!=='pendente'?'checked':''}><span class="track"></span></label>
      </div>
      <div class="form-row"><label>Observação</label><textarea class="input" name="observacao" rows="2" style="resize:vertical;">${escapeHtml(v.observacao||'')}</textarea></div>
    </div>

      ${isEdit?`<button class="btn" data-close-drawer style="flex:1;">Cancelar</button><button class="btn btn-primary" data-save-vistoria style="flex:2;">Salvar alterações</button>`:`<button class="btn" data-close-drawer style="flex:1;">Cancelar</button><button class="btn btn-primary" data-save-vistoria style="flex:2;">${icon('plus')} Cadastrar vistoria</button>`}
    </div>
  `, drawer=>{
    let canal = v.canal;
    const placaInput = drawer.querySelector('[name="placa"]');
    placaInput.addEventListener('input', e=>{ e.target.value = e.target.value.toUpperCase(); });
    const clienteInput = drawer.querySelector('[name="cliente"]');
    clienteInput.addEventListener('change', e=>{
      canal = inferCanal(e.target.value);
      drawer.querySelectorAll('[data-chip-value]').forEach(c=>c.classList.toggle('active', c.dataset.chipValue===canal));
    });
    drawer.querySelectorAll('[data-chip-value]').forEach(chip=>chip.addEventListener('click', ()=>{

    }));

  const e = existing || {ano:now.getFullYear(), mesNum:now.getMonth()+1, investimentoGoogle:0, visualizacoes:0, cliques:0, conversoes:0, custoPorConversao:0};
  openDrawer(`
    <div class="drawer-head"><h3>${existing?'Editar mês':'Registrar mês'}</h3><button class="icon-btn" data-close-drawer>${icon('x')}</button></div>
    <div class="drawer-body">
      <div class="form-2col">
        <div class="form-row"><label>Mês</label><select class="input" name="mesNum" ${existing?'disabled':''}>${MESES_PT.map((m,i)=>`<option value="${i+1}" ${i+1===e.mesNum?'selected':''}>${m}</option>`).join('')}</select></div>
        <div class="form-row"><label>Ano</label><input class="input" type="number" name="ano" value="${e.ano}" ${existing?'disabled':''}></div>
      </div>
      <div class="form-row"><label>Investimento Google Ads (R$)</label><input class="input" type="number" step="0.01" name="investimentoGoogle" value="${e.investimentoGoogle}"></div>
      <div class="form-2col">
        <div class="form-row"><label>Visualizações</label><input class="input" type="number" name="visualizacoes" value="${e.visualizacoes}"></div>
        <div class="form-row"><label>Cliques</label><input class="input" type="number" name="cliques" value="${e.cliques}"></div>
      </div>
      <div class="form-2col">
        <div class="form-row"><label>Conversões</label><input class="input" type="number" name="conversoes" value="${e.conversoes}"></div>
        <div class="form-row"><label>Custo por conversão (R$)</label><input class="input" type="number" step="0.01" name="custoPorConversao" value="${e.custoPorConversao}"></div>
      </div>
      <div class="chart-sub">Faturamento e quantidade de vistorias por canal são calculados automaticamente a partir dos lançamentos em Vistorias quando existirem para o mês.</div>
    </div>
    <div class="drawer-foot"><button class="btn" data-close-drawer style="flex:1;">Cancelar</button><button class="btn btn-primary" data-save-evo style="flex:2;">Salvar</button></div>
  `, drawer=>{
    drawer.querySelector('[data-save-evo]').addEventListener('click', ()=>{
      const f = drawer;
      const mesNum = parseInt(f.querySelector('[name="mesNum"]').value);
      const ano = parseInt(f.querySelector('[name="ano"]').value);
      const data = {
        ano, mesNum, mes: MESES_PT[mesNum-1],
        investimentoGoogle: parseFloat(f.querySelector('[name="investimentoGoogle"]').value)||0,
        visualizacoes: parseFloat(f.querySelector('[name="visualizacoes"]').value)||0,
        cliques: parseFloat(f.querySelector('[name="cliques"]').value)||0,
        conversoes: parseFloat(f.querySelector('[name="conversoes"]').value)||0,
        custoPorConversao: parseFloat(f.querySelector('[name="custoPorConversao"]').value)||0,
        faturamentoGoogle: existing?existing.faturamentoGoogle||0:0, faturamentoParticular: existing?existing.faturamentoParticular||0:0, faturamentoParceiros: existing?existing.faturamentoParceiros||0:0,
        qtdGoogle: existing?existing.qtdGoogle||0:0, qtdParticular: existing?existing.qtdParticular||0:0, qtdParceiros: existing?existing.qtdParceiros||0:0,
      };
      const id = monthKey(ano,mesNum);
      if(state.db) state.db.doc('evolucao/'+id).set(data).then(()=>toast('Mês salvo')).catch(()=>toast('Erro ao salvar','error'));
      closeDrawer();
    });
  });
}

function confirmDialog(msg, onConfirm){
  openDrawer(`
    <div class="drawer-head"><h3>Confirmar ação</h3><button class="icon-btn" data-close-drawer>${icon('x')}</button></div>
    <div class="drawer-body"><p>${escapeHtml(msg)}</p></div>

  `, drawer=>{ drawer.querySelector('[data-confirm-yes]').addEventListener('click', ()=>{ onConfirm(); closeDrawer(); }); });
}

function addDoc(collection, data){
  if(!state.db){ toast('Sem conexão com o banco de dados','error'); return; }
  state.db.collection(collection).add(data).catch(()=>toast('Erro ao salvar','error'));
}
function updateDoc(collection, id, data){
  if(!state.db){ toast('Sem conexão com o banco de dados','error'); return; }
  state.db.doc(collection+'/'+id).update(data).catch(()=>toast('Erro ao salvar','error'));
}
function deleteDoc(collection, id){
  if(!state.db){ toast('Sem conexão com o banco de dados','error'); return; }
  state.db.doc(collection+'/'+id).delete().then(()=>toast('Registro excluído')).catch(()=>toast('Erro ao excluir','error'));
}

/* =========================================================================
   EXPORTS: EXCEL & PDF

async function saveFile(filename, blob){
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('Arquivo baixado');
  }catch(e){ toast('Não foi possível gerar o arquivo','error'); }
}

const EXPORT_COLUMNS = {
  vistorias: [['Data','data'],['Placa','placa'],['Veículo','veiculo'],['Cliente','cliente'],['Canal','canal'],['Tipo','tipo'],['Forma de pagamento','formaPagamento'],['Valor','valor'],['Nota fiscal','notaFiscal'],['Status','status']],
  agendamentos: [['Data','data'],['Horário','horario'],['Nome','nome'],['Contato','contato'],['Veículo','veiculo'],['Placa','placa'],['Tipo','tipo'],['Valor','valor'],['Aberta no sistema','abertaNoSistema'],['Compareceu','compareceu']],
  transferencias: [['Data','data'],['Placa','placa'],['Veículo','veiculo'],['Despachante','despachante'],['Recebido','recebido'],['Repassado','pago']],
  evolucao: [['Mês','mes'],['Ano','ano'],['Faturamento Google','faturamentoGoogle'],['Faturamento Particular','faturamentoParticular'],['Faturamento Parceiros','faturamentoParceiros'],['Investimento Google','investimentoGoogle'],['Visualizações','visualizacoes'],['Cliques','cliques'],['Conversões','conversoes']],
};
// periodFilter: {periodo, customStart, customEnd}. extra (só afeta 'vistorias'):
// {tipos:[], formas:[], canais:[], cliente:''}
function rowsFor(tipo, periodFilter, extra){
  extra = extra || {};
  const {start,end} = resolvePeriodAny(periodFilter);
  if(tipo==='vistorias'){
    let list = state.vistorias.filter(v=>inRange(v.data,start,end));
    if(extra.tipos && extra.tipos.length) list = list.filter(v=>extra.tipos.includes(v.tipo));
    if(extra.formas && extra.formas.length) list = list.filter(v=>extra.formas.includes(v.formaPagamento));
    if(extra.canais && extra.canais.length) list = list.filter(v=>vistoriaMatchesCanal(v, extra.canais));
    if(extra.cliente) list = list.filter(v=>(v.cliente||'')===extra.cliente);
    return list.sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  }
  if(tipo==='agendamentos') return state.agendamentos.filter(a=>inRange(a.data,start,end));
  if(tipo==='transferencias') return state.transferencias.filter(t=>!t.data || inRange(t.data,start,end));
  if(tipo==='evolucao') return evoSorted().map(getEvoRow).filter(r=>{ const d=new Date(r.ano,r.mesNum-1,1); return d>=start && d<end; });
  return [];
}

// Linha de totais (soma de valores) para o rodapé de PDF/Excel — retorna null
// quando o tipo não tem uma coluna numérica que faça sentido somar.
function totalsRowFor(tipo, cols, rows){
  const sum = key => rows.reduce((s,r)=>s+(Number(r[key])||0), 0);
  const firstCol = cols[0][1];
  if(tipo==='vistorias' || tipo==='agendamentos'){
    return cols.map(c=> c[1]==='valor' ? fmtMoney(sum('valor')) : (c[1]===firstCol ? `Total (${rows.length})` : ''));
  }
  if(tipo==='transferencias'){
    return cols.map(c=>{
      if(c[1]==='recebido') return fmtMoney(sum('recebido'));
      if(c[1]==='pago') return fmtMoney(sum('pago'));
      if(c[1]===firstCol) return `Total (${rows.length})`;
      return '';
    });
  }
  return null;
}

function exportExcel(tipo, rows){
  const cols = EXPORT_COLUMNS[tipo];
  const aoa = [cols.map(c=>c[0])].concat(rows.map(r=>cols.map(c=>{
    const v = r[c[1]];
    if(typeof v==='boolean') return v?'Sim':'Não';
    return v==null?'':v;
  })));
  const foot = totalsRowFor(tipo, cols, rows);
  if(foot) aoa.push(foot);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = cols.map(()=>({wch:16}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, tipo.slice(0,31));
  const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  saveFile(`visao-total-${tipo}-${todayISO()}.xlsx`, new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}
function exportPDF(tipo, rows, filterSummary){
  const cols = EXPORT_COLUMNS[tipo];
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape', unit:'pt'});
  const startY = drawPdfHeader(doc, `Relatório de ${labelForTipo(tipo)}`, [filterSummary, `${rows.length} registro(s)`].filter(Boolean).join(' · '));
  const foot = totalsRowFor(tipo, cols, rows);
  doc.autoTable({
    startY,
    head: [cols.map(c=>c[0])],
    body: rows.map(r=>cols.map(c=>{ const v=r[c[1]]; if(typeof v==='boolean') return v?'Sim':'Não'; if(c[1]==='valor'||c[1]==='recebido'||c[1]==='pago') return fmtMoney(v); return v==null?'':String(v); })),
    foot: foot?[foot]:undefined,
    styles:{fontSize:8, cellPadding:5}, headStyles:{fillColor:[45,55,116], textColor:255},
    footStyles:{fillColor:[230,230,224], textColor:[20,20,30], fontStyle:'bold'},
    alternateRowStyles:{fillColor:[246,246,244]},
  });
  saveFile(`visao-total-${tipo}-${todayISO()}.pdf`, doc.output('blob'));
}
function labelForTipo(tipo){ return {vistorias:'Vistorias', evolucao:'Evolução & Marketing', agendamentos:'Agendamentos', transferencias:'Transferências', geral:'Geral'}[tipo]||tipo; }

function drawPdfHeader(doc, title, subtitle){
  doc.setFillColor(45,55,116); doc.rect(0,0,doc.internal.pageSize.getWidth(),56,'F');
  doc.setTextColor(255,255,255); doc.setFontSize(16); doc.text('Visão Total', 40, 28);
  doc.setFontSize(10); doc.setTextColor(220,222,240); doc.text('Sistema de gestão de vistorias', 40, 42);
  doc.setTextColor(20,20,30); doc.setFontSize(13); doc.text(title, 40, 76);
  doc.setFontSize(9); doc.setTextColor(120,120,130); doc.text('Gerado em '+fmtDateBR(todayISO()), doc.internal.pageSize.getWidth()-40, 76, {align:'right'});
  if(subtitle){
    doc.setFontSize(8.5); doc.setTextColor(120,120,130);
    doc.text(subtitle, 40, 91, {maxWidth: doc.internal.pageSize.getWidth()-80});
    return 102;
  }
  return 92;
}

function generateReportExcel(tipo, periodFilter, extra){
  const wb = XLSX.utils.book_new();
  const tipos = tipo==='geral'? ['vistorias','evolucao','agendamentos','transferencias'] : [tipo];
  tipos.forEach(t=>{
    const cols = EXPORT_COLUMNS[t]; const rows = rowsFor(t, periodFilter, extra);
    const aoa = [cols.map(c=>c[0])].concat(rows.map(r=>cols.map(c=>{ const v=r[c[1]]; if(typeof v==='boolean') return v?'Sim':'Não'; return v==null?'':v; })));
    const foot = totalsRowFor(t, cols, rows);
    if(foot) aoa.push(foot);
    const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=cols.map(()=>({wch:16}));
    XLSX.utils.book_append_sheet(wb, ws, t.slice(0,31));
  });
  const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  saveFile(`visao-total-relatorio-${tipo}-${todayISO()}.xlsx`, new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}
function generateReportPDF(tipo, periodFilter, extra, filterSummary){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape', unit:'pt'});
  const tipos = tipo==='geral'? ['vistorias','evolucao','agendamentos','transferencias'] : [tipo];
  tipos.forEach((t,i)=>{
    if(i>0) doc.addPage();
    const cols = EXPORT_COLUMNS[t]; const rows = rowsFor(t, periodFilter, extra);
    const startY = drawPdfHeader(doc, `Relatório de ${labelForTipo(t)}`, [filterSummary, `${rows.length} registro(s)`].filter(Boolean).join(' · '));
    const foot = totalsRowFor(t, cols, rows);
    doc.autoTable({ startY, head:[cols.map(c=>c[0])], body: rows.map(r=>cols.map(c=>{ const v=r[c[1]]; if(typeof v==='boolean') return v?'Sim':'Não'; if(['valor','recebido','pago'].includes(c[1])) return fmtMoney(v); return v==null?'':String(v); })),
      foot: foot?[foot]:undefined,
      styles:{fontSize:8,cellPadding:5}, headStyles:{fillColor:[45,55,116], textColor:255}, footStyles:{fillColor:[230,230,224], textColor:[20,20,30], fontStyle:'bold'}, alternateRowStyles:{fillColor:[246,246,244]} });
  });
  saveFile(`visao-total-relatorio-${tipo}-${todayISO()}.pdf`, doc.output('blob'));
}

/* =========================================================================
   API: fala com o backend Node deste PC via REST + Server-Sent Events, com a
   mesma "forma" de chamada (collection/doc, onSnapshot/add/set/update/delete)
   que o resto do app já usa — por isso o resto do código não muda.
   ========================================================================= */
function createApiDb(baseUrl, token, onAuthError){
  const listeners = {}; // nome da coleção -> Set de funções de recarregar
  function on(name, fn){ (listeners[name] = listeners[name] || new Set()).add(fn); return ()=>listeners[name].delete(fn); }
  function notify(name){ (listeners[name] || []).forEach(fn=>fn()); }

  async function req(method, path, body){
    let res;
    try{
      res = await fetch(baseUrl + path, {
        method,
        headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { 'x-access-token': token } : {}),
        body: body !== undefined ? JSON.stringify(body) : undefined,
      });
    }catch(e){ throw { code: 'unavailable', message: 'Não foi possível falar com o servidor.' }; }
    if(res.status === 401){ onAuthError && onAuthError(); throw { code: 'revoked', message: 'Token de acesso inválido.' }; }
    if(res.status === 404) return null;
    if(!res.ok) throw { code: 'unavailable', message: await res.text().catch(()=>res.statusText) };
    if(res.status === 204) return null;
    return res.json();
  }

  // Tempo real: qualquer escrita (deste dispositivo ou de outro) chega aqui
  // e recarrega só a coleção afetada. Some/reconecta sozinho se cair.
  let es;
  function connectEvents(){
    try{
      es = new EventSource(baseUrl + '/api/events?token=' + encodeURIComponent(token || ''));
      es.onmessage = (e)=>{ try{ notify(JSON.parse(e.data).collection); }catch(_){} };
      es.onerror = ()=>{ es.close(); setTimeout(connectEvents, 4000); };
    }catch(_){ setTimeout(connectEvents, 4000); }
  }
  connectEvents();
  // Reforço: recarrega tudo periodicamente, para o caso de o navegador/rede
  // derrubar a conexão de eventos sem avisar.
  setInterval(()=>Object.keys(listeners).forEach(notify), 20000);

  function collection(name){
    return {
      async add(data){ return req('POST', `/api/collections/${name}`, data); },
      onSnapshot(next, error){
        let cancelled = false;
        async function load(){
          try{
            const docs = (await req('GET', `/api/collections/${name}`)) || [];
            if(cancelled) return;
            next({ docs: docs.map(d=>({ id: d.id, exists: true, data: ()=>{ const { id, ...rest } = d; return rest; } })) });
          }catch(e){ error && error(e); }
        }
        load();
        const off = on(name, load);
        return ()=>{ cancelled = true; off(); };
      },
    };
  }

  function doc(path){
    const i = path.indexOf('/');
    const name = path.slice(0, i), id = path.slice(i + 1);
    return {
      async set(data){ return req('PUT', `/api/collections/${name}/${id}`, data); },
      async update(data){ return req('PATCH', `/api/collections/${name}/${id}`, data); },
      async delete(){ return req('DELETE', `/api/collections/${name}/${id}`); },
      onSnapshot(next, error){
        let cancelled = false;
        async function load(){
          try{
            const d = await req('GET', `/api/collections/${name}/${id}`);
            if(cancelled) return;
            if(d) next({ exists: true, data: ()=>{ const { id: _id, ...rest } = d; return rest; } });
            else next({ exists: false, data: ()=>undefined });
          }catch(e){ error && error(e); }
        }
        load();
        const off = on(name, load);
        return ()=>{ cancelled = true; off(); };
      },
    };
  }

  return { collection, doc };
}

/* =========================================================================
   PORTAL DE CONEXÃO: pede o endereço do servidor e o token de acesso na
   primeira vez (ou quando alguém pede pra trocar), guarda no navegador.
   ========================================================================= */
const CONN_KEY_URL = 'vt.apiBase', CONN_KEY_TOKEN = 'vt.token';
function getSavedConnection(){
  try{ return { baseUrl: localStorage.getItem(CONN_KEY_URL) || '', token: localStorage.getItem(CONN_KEY_TOKEN) || '' }; }
  catch(_){ return { baseUrl: '', token: '' }; }
}
function saveConnection(baseUrl, token){
  try{ localStorage.setItem(CONN_KEY_URL, baseUrl); localStorage.setItem(CONN_KEY_TOKEN, token); }catch(_){}
}
function forgetConnection(){
  try{ localStorage.removeItem(CONN_KEY_URL); localStorage.removeItem(CONN_KEY_TOKEN); }catch(_){}
  location.reload();
}
async function testConnection(baseUrl, token){
  let res;
  try{ res = await fetch(baseUrl.replace(/\/$/, '') + '/api/collections/config/geral', { headers: token ? { 'x-access-token': token } : {} }); }
  catch(_){ throw new Error('Não foi possível conectar a esse endereço.'); }
  if(res.status === 401) throw new Error('Token de acesso incorreto.');
  if(!res.ok) throw new Error('Não foi possível conectar a esse endereço.');
}
function showConnectGate(message){
  const gate = document.getElementById('connectGate');
  const saved = getSavedConnection();
  document.getElementById('gateUrl').value = saved.baseUrl || '';
  document.getElementById('gateToken').value = '';
  const errEl = document.getElementById('gateError');
  errEl.style.display = message ? 'block' : 'none';
  errEl.textContent = message || '';
  gate.style.display = 'flex';
  requestAnimationFrame(()=>{ gate.style.opacity = '1'; });
}
function hideConnectGate(){
  const gate = document.getElementById('connectGate');
  gate.style.opacity = '0';
  setTimeout(()=>{ gate.style.display = 'none'; }, 220);
}
document.getElementById('gateSubmit').addEventListener('click', async ()=>{
  const btn = document.getElementById('gateSubmit');
  const baseUrl = document.getElementById('gateUrl').value.trim().replace(/\/$/, '');
  const token = document.getElementById('gateToken').value.trim();
  const errEl = document.getElementById('gateError');
  if(!baseUrl){ errEl.textContent = 'Informe o endereço do servidor.'; errEl.style.display = 'block'; return; }
  btn.textContent = 'Conectando…'; btn.disabled = true;
  try{
    await testConnection(baseUrl, token);
    saveConnection(baseUrl, token);
    hideConnectGate();
    startApp(baseUrl, token);
  }catch(e){
    errEl.textContent = e.message || 'Não foi possível conectar.';
    errEl.style.display = 'block';
  }finally{
    btn.textContent = 'Conectar'; btn.disabled = false;
  }
});
document.getElementById('gateToken').addEventListener('keydown', e=>{ if(e.key === 'Enter') document.getElementById('gateSubmit').click(); });
document.getElementById('changeConnBtn').addEventListener('click', forgetConnection);

/* =========================================================================
   BOOTSTRAP
   ========================================================================= */
renderNav();
renderRoute();

function startApp(baseUrl, token){
  const db = createApiDb(baseUrl, token, ()=>showConnectGate('Token de acesso inválido — conecte novamente.'));
  state.db = db;
  db.collection('vistorias').onSnapshot(snap=>{ state.vistorias = snap.docs.map(d=>({id:d.id, ...d.data()})); state.loaded.vistorias=true; scheduleRender(); }, ()=>{});
  db.collection('evolucao').onSnapshot(snap=>{ state.evolucao = snap.docs.map(d=>({id:d.id, ...d.data()})); state.loaded.evolucao=true; scheduleRender(); }, ()=>{});
  db.collection('agendamentos').onSnapshot(snap=>{ state.agendamentos = snap.docs.map(d=>({id:d.id, ...d.data()})); state.loaded.agendamentos=true; scheduleRender(); }, ()=>{});
  db.collection('transferencias').onSnapshot(snap=>{ state.transferencias = snap.docs.map(d=>({id:d.id, ...d.data()})); state.loaded.transferencias=true; scheduleRender(); }, ()=>{});
  db.doc('conciliacao/atual').onSnapshot(snap=>{ if(snap.exists) state.conciliacao = snap.data(); state.loaded.conciliacao=true; scheduleRender(); }, ()=>{});
  db.doc('config/geral').onSnapshot(snap=>{ if(snap.exists) state.config = Object.assign({empresa:{nome:'Visão Total Vistorias'}}, snap.data()); state.loaded.config=true; scheduleRender(); }, ()=>{});
}

(function init(){
  const saved = getSavedConnection();
  if(saved.baseUrl){
    testConnection(saved.baseUrl, saved.token)
      .then(()=>startApp(saved.baseUrl, saved.token))
      .catch(err=>showConnectGate(err.message));
  } else {
    showConnectGate();
  }
})();

})();
</script>
